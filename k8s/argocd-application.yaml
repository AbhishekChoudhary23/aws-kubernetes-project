apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AbhishekChoudhary23/aws-kubernetes-project.git
    targetRevision: aws-prod
    path: k8s/manifests
    directory:
      recurse: true
    exclude: 'monitoring/**'
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
