# Template for pulling private images from GitHub Container Registry (ghcr.io).
# Use scripts/create-ghcr-secret.sh to create this secret from your GitHub Personal Access Token (read:packages).
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: observability
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <BASE64_ENCODED_DOCKER_CONFIG_JSON>
