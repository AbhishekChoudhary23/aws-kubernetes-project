# Template for pulling private images from Google Container Registry (GCR).
# Use scripts/create-gcr-secret.sh to create this secret safely from your GCP Service Account JSON key.
apiVersion: v1
kind: Secret
metadata:
  name: gcr-json-key
  namespace: observability
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <BASE64_ENCODED_DOCKER_CONFIG_JSON>
