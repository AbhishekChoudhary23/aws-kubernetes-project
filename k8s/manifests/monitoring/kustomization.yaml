apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources in this monitoring directory are rendered together by Kustomize.
resources:
  - monitoring-stack.yaml

# Build the dashboard JSON file into a ConfigMap.
# Kustomize adds a content hash to the ConfigMap name and rewrites the
# Deployment's configMap reference when the JSON changes.
configMapGenerator:
  - name: grafana-sre-dashboard
    namespace: monitoring
    files:
      - SRE-grafana-dashboard.json
