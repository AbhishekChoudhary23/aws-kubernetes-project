AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Production-ready CloudFormation template for the observability-eks cluster,
  worker node security group and ingress rules, managed node group, EKS add-ons
  with proper dependency ordering, cluster access entry, and AWS Load Balancer
  Controller IAM policy.

Parameters:
  ClusterName:
    Type: String
    Default: observability-eks
    Description: Name of the Amazon EKS cluster.

  KubernetesVersion:
    Type: String
    Default: '1.31'
    AllowedValues:
      - '1.29'
      - '1.30'
      - '1.31'
      - '1.32'
      - '1.33'
      - '1.34'
      - '1.35'
      - '1.36'
    Description: Kubernetes control plane version.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the EKS cluster and worker nodes will be deployed (from Terraform output).

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet ID for external load balancers.

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet ID for external load balancers.

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet ID for EKS worker nodes.

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet ID for EKS worker nodes.

  ClusterRoleArn:
    Type: String
    Description: IAM Role ARN for the EKS control plane (from Terraform IAM output).

  NodeRoleArn:
    Type: String
    Description: IAM Role ARN for the EKS worker node group (from Terraform IAM output).

  ClusterAdminRoleArn:
    Type: String
    Default: ''
    Description: Optional IAM Role or User ARN to grant AmazonEKSClusterAdminPolicy via AccessEntry.

  KubernetesApiPublicCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
    Description: CIDR block allowed to access the public EKS API endpoint.

  NodeInstanceType:
    Type: String
    Default: m7i-flex.large
    Description: EC2 instance type for worker nodes.

  NodeCapacityType:
    Type: String
    Default: ON_DEMAND
    AllowedValues:
      - ON_DEMAND
      - SPOT
    Description: Capacity type for the managed node group.

  NodeDiskSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 500
    Description: Root EBS volume size (GiB) for worker nodes.

  NodeMinSize:
    Type: Number
    Default: 2
    MinValue: 1

  NodeDesiredSize:
    Type: Number
    Default: 2
    MinValue: 1

  NodeMaxSize:
    Type: Number
    Default: 3
    MinValue: 1

Conditions:
  HasClusterAdminRole: !Not [!Equals [!Ref ClusterAdminRoleArn, '']]

Resources:
  # =========================================================
  # CONTROL PLANE SECURITY GROUP
  # =========================================================
  ClusterControlPlaneSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Additional security group for EKS control plane communication
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic from control plane
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-control-plane-sg'
        - Key: Environment
          Value: sandbox
        - Key: ManagedBy
          Value: cloudformation

  # =========================================================
  # EKS CLUSTER
  # =========================================================
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !Ref ClusterRoleArn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroupIds:
          - !Ref ClusterControlPlaneSecurityGroup
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
        PublicAccessCidrs:
          - !Ref KubernetesApiPublicCidr
      KubernetesNetworkConfig:
        IpFamily: ipv4
        ServiceIpv4Cidr: 172.20.0.0/16
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      Tags:
        - Key: Name
          Value: !Ref ClusterName
        - Key: Environment
          Value: sandbox
        - Key: ManagedBy
          Value: cloudformation

  # =========================================================
  # EKS ACCESS ENTRY (OPTIONAL ADDITIONAL ADMIN)
  # =========================================================
  ClusterAdminAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: HasClusterAdminRole
    Properties:
      ClusterName: !Ref EKSCluster
      PrincipalArn: !Ref ClusterAdminRoleArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  # =========================================================
  # PRE-NODE ADD-ONS (CNI, KUBE-PROXY, POD IDENTITY)
  # =========================================================
  VPCCNIAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE

  KubeProxyAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE

  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE

  # =========================================================
  # MANAGED NODE GROUP (DEPENDS ON NETWORKING ADD-ONS)
  # =========================================================
  EKSNodegroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - VPCCNIAddon
      - KubeProxyAddon
      - PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: !Sub '${ClusterName}-node-group'
      NodeRole: !Ref NodeRoleArn
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: !Ref NodeCapacityType
      InstanceTypes:
        - !Ref NodeInstanceType
      DiskSize: !Ref NodeDiskSize
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      ScalingConfig:
        MinSize: !Ref NodeMinSize
        DesiredSize: !Ref NodeDesiredSize
        MaxSize: !Ref NodeMaxSize
      UpdateConfig:
        MaxUnavailable: 1
      NodeRepairConfig:
        Enabled: true
      Labels:
        workload: general
      Tags:
        Name: !Sub '${ClusterName}-worker-node'
        Environment: sandbox
        ManagedBy: cloudformation

  # =========================================================
  # POST-NODE ADD-ONS (COREDNS & NODE MONITORING REQUIRE NODES)
  # =========================================================
  CoreDNSAddon:
    Type: AWS::EKS::Addon
    DependsOn: EKSNodegroup
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE

  NodeMonitoringAgentAddon:
    Type: AWS::EKS::Addon
    DependsOn: EKSNodegroup
    Properties:
      ClusterName: !Ref EKSCluster
      AddonName: eks-node-monitoring-agent
      ResolveConflicts: OVERWRITE

  # =========================================================
  # AWS LOAD BALANCER CONTROLLER IAM POLICY
  # =========================================================
  AWSLoadBalancerControllerIAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ClusterName}-AWSLoadBalancerControllerIAMPolicy'
      Description: IAM policy for the AWS Load Balancer Controller on EKS
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName: elasticloadbalancing.amazonaws.com
          - Effect: Allow
            Action:
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeVpcs
              - ec2:DescribeVpcPeeringConnections
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeInstances
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeTags
              - ec2:GetCoipPoolUsage
              - ec2:DescribeCoipPools
              - ec2:GetSecurityGroupsForVpc
              - ec2:DescribeIpamPools
              - ec2:DescribeRouteTables
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeListenerCertificates
              - elasticloadbalancing:DescribeSSLPolicies
              - elasticloadbalancing:DescribeRules
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetHealth
              - elasticloadbalancing:DescribeTags
              - elasticloadbalancing:DescribeTrustStores
              - elasticloadbalancing:DescribeListenerAttributes
              - elasticloadbalancing:DescribeCapacityReservation
            Resource: '*'
          - Effect: Allow
            Action:
              - cognito-idp:DescribeUserPoolClient
              - acm:ListCertificates
              - acm:DescribeCertificate
              - iam:ListServerCertificates
              - iam:GetServerCertificate
              - waf-regional:GetWebACL
              - waf-regional:GetWebACLForResource
              - waf-regional:AssociateWebACL
              - waf-regional:DisassociateWebACL
              - wafv2:GetWebACL
              - wafv2:GetWebACLForResource
              - wafv2:AssociateWebACL
              - wafv2:DisassociateWebACL
              - shield:GetSubscriptionState
              - shield:DescribeProtection
              - shield:CreateProtection
              - shield:DeleteProtection
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:CreateSecurityGroup
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:CreateTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              StringEquals:
                ec2:CreateAction: CreateSecurityGroup
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'true'
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:DeleteSecurityGroup
            Resource: '*'
            Condition:
              'Null':
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
            Resource: '*'
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:DeleteRule
            Resource: '*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'true'
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:listener/net/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener/app/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener-rule/net/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener-rule/app/*/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:SetIpAddressType
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:ModifyListenerAttributes
              - elasticloadbalancing:ModifyCapacityReservation
              - elasticloadbalancing:ModifyIpPools
            Resource: '*'
            Condition:
              'Null':
                aws:ResourceTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              StringEquals:
                elasticloadbalancing:CreateAction:
                  - CreateTargetGroup
                  - CreateLoadBalancer
              'Null':
                aws:RequestTag/elbv2.k8s.aws/cluster: 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:DeregisterTargets
            Resource: arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:SetWebAcl
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:AddListenerCertificates
              - elasticloadbalancing:RemoveListenerCertificates
              - elasticloadbalancing:ModifyRule
              - elasticloadbalancing:SetRulePriorities
            Resource: '*'

Outputs:
  ClusterName:
    Description: EKS cluster name
    Value: !Ref EKSCluster

  ClusterArn:
    Description: EKS cluster ARN
    Value: !GetAtt EKSCluster.Arn

  ClusterEndpoint:
    Description: EKS Kubernetes API endpoint
    Value: !GetAtt EKSCluster.Endpoint

  ClusterSecurityGroupId:
    Description: EKS cluster primary security group created by EKS
    Value: !GetAtt EKSCluster.ClusterSecurityGroupId

  ControlPlaneSecurityGroupId:
    Description: Additional control plane security group ID
    Value: !Ref ClusterControlPlaneSecurityGroup

  NodegroupName:
    Description: Managed node group name
    Value: !Ref EKSNodegroup

  ALBControllerPolicyArn:
    Description: IAM Managed Policy ARN for AWS Load Balancer Controller
    Value: !Ref AWSLoadBalancerControllerIAMPolicy
