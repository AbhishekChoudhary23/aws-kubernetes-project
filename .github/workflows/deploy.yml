name: Build, Push to ECR & Update GitOps Manifests (Single Repo)

on:
  push:
    branches:
      - aws-prod
    paths:
      - 'application/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  BACKEND_ECR_REPO: observability-backend
  FRONTEND_ECR_REPO: observability-frontend

jobs:
  build-and-deploy:
    name: Build, Push & Update K8s Manifests
    runs-on: ubuntu-latest
    environment: aws-creds

    steps:
      # ─── 1. Checkout Monorepo ───────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── 2. Configure AWS Credentials ───────────────────────────────────────
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─── 3. Login to Amazon ECR ─────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ─── 4. Set Build Variables ─────────────────────────────────────────────
      - name: Set Build Variables
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"

          BUILD_TAG="prod-${{ github.run_number }}-$(git rev-parse --short HEAD)"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"

          echo "Backend: ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPO }}"
          echo "Frontend: ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPO }}"
          echo "Build Tag: $BUILD_TAG"

      # ─── 5. Build & Push Backend Image ──────────────────────────────────────
      - name: Build & Push Backend Image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$BACKEND_ECR_REPO:$BUILD_TAG" \
            -t "$ECR_REGISTRY/$BACKEND_ECR_REPO:latest" \
            ./application/backend

          docker push "$ECR_REGISTRY/$BACKEND_ECR_REPO:$BUILD_TAG"
          docker push "$ECR_REGISTRY/$BACKEND_ECR_REPO:latest"

      # ─── 6. Build & Push Frontend Image ─────────────────────────────────────
      - name: Build & Push Frontend Image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_ECR_REPO:$BUILD_TAG" \
            -t "$ECR_REGISTRY/$FRONTEND_ECR_REPO:latest" \
            ./application/frontend

          docker push "$ECR_REGISTRY/$FRONTEND_ECR_REPO:$BUILD_TAG"
          docker push "$ECR_REGISTRY/$FRONTEND_ECR_REPO:latest"

      # ─── 7. Update K8s Manifests in This Same Repo ──────────────────────────
      - name: Update Image Tags in k8s/manifests
        run: |
          echo "Updating backend image in k8s/manifests/backend/deployment.yaml..."
          sed -i "s|image: .*|image: $ECR_REGISTRY/$BACKEND_ECR_REPO:$BUILD_TAG|g" \
            k8s/manifests/backend/deployment.yaml

          echo "Updating frontend image in k8s/manifests/frontend/deployment.yaml..."
          sed -i "s|image: .*|image: $ECR_REGISTRY/$FRONTEND_ECR_REPO:$BUILD_TAG|g" \
            k8s/manifests/frontend/deployment.yaml

          echo "=== Updated Manifests ==="
          grep "image:" k8s/manifests/backend/deployment.yaml
          grep "image:" k8s/manifests/frontend/deployment.yaml

      # ─── 8. Commit and Push Manifest Changes Back to Branch ─────────────────
      - name: Commit & Push Updated Manifests
        run: |
          git config user.name "GitHub Actions CI"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/manifests/backend/deployment.yaml k8s/manifests/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "ci: update ECR image tags to $BUILD_TAG [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # ─── 9. Build Summary ───────────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "=========================================="
          echo "  SINGLE-REPO BUILD & GITOPS UPDATE DONE"
          echo "=========================================="
          echo "Backend:  $ECR_REGISTRY/$BACKEND_ECR_REPO:$BUILD_TAG"
          echo "Frontend: $ECR_REGISTRY/$FRONTEND_ECR_REPO:$BUILD_TAG"
          echo "Branch:   ${{ github.ref_name }}"
          echo "ArgoCD:   Auto-syncing from k8s/manifests"
          echo "=========================================="
